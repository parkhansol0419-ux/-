name: APK 만들기
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 압축 풀기
        run: unzip -o byeonsin-app.zip
      - name: APK 빌드
        working-directory: byeonsin-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: byeonsin-apk
          path: byeonsin-app/app/build/outputs/apk/debug/app-debug.apk
      - name: 업데이트 버튼용으로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: 변신 다이어리 1.${{ github.run_number }}
          make_latest: true
          files: byeonsin-app/app/build/outputs/apk/debug/app-debug.apk
