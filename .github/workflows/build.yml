name: APK 만들기
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 압축 풀기
        run: unzip -o byeonsin-app.zip
      - name: APK 빌드
        working-directory: byeonsin-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: byeonsin-apk
          path: byeonsin-app/app/build/outputs/apk/debug/app-debug.apk
